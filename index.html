<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1" shrink-to-fit="no">
	<title>nysleaners</title>
	<link rel="stylesheet" type="text/css" href="style.css">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
		integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
		crossorigin="anonymous" referrerpolicy="no-referrer" />
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
		integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">\
	<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
		integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
		crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js"
		integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
		crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js"
		integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
		crossorigin="anonymous"></script>
</head>

<body>
	<!--navbar-->
	<nav>
		<div class="container-fluid ">
			<div class="div1-nav">
				<!--home bar-->
				<a href="" class="home-nav">
					<i class="fa-solid fa-house"></i>
					&nbsp;Home
				</a>
			</div>
			<div class="div2-nav">
				<h2 id="nav-text">Nysonlearners</h2>
			</div>
			<div class="div3-nav">
				<!-- for notification -->
				<div class="notification">
					<button class="style-icon-notification">
						<i class="fa-regular fa-bell"></i>
					</button>
				</div>
				<!-- for logo -->
				<div class="logo">
					<div class="username">
						<h3>name</h3>
					</div>
					<div class="imgicon">
						<img src="https://nyslearners.com/static/profile_pics/default.png" alt="image.png">
					</div>
				</div>
				<!-- logout-->
				<div class="logout">
					<button class="style-icon-logout">
						<i class="fa-solid fa-power-off"></i>
					</button>
				</div>
			</div>
		</div>
	</nav>
	<!-- entire body -->
<div class="container border shadow-lg">
	<!-- dashboard-->
<div class="container custome-conatainer-dashboard mt-3 p-2 border shadow-md">
	<div class="container-lg custome-conatiner mx-auto d-flex flex-column ">
		<div class="col-lg-6 col-md-6 custome-container2 mx-auto">
			<img src="https://nyslearners.com/static/profile_pics/default.png"> 
				<br>
			<p><span><b>Hi</b></span>&nbsp;Name</p>
		</div>
		<div class="row">
			<div class="col-md-8 mx-auto">
				<div class="progress">
					<div class="progress-bar progress-bar-striped progress-bar-animated" style="width:80%"></div>
				</div>
			</div>
		</div>
		<h3 class="text-center text-white">your current status<h3>
	</div>
</div>
	<!-- content-->
	<main id="main-content">
		<div class="container border rounded-0 p-4 shadow-md">
			<div class="card border rounded m-2">
		<div class="card-header h-50"><h3 class="card-title text-white">notes</h3></div>
				 <!-- VIDEO SECTION -->
			    <div class="card-body">
			    	<div class="container mt-1">
			    		 <div class="row g-0">
   
              <div class="col-lg-9 col-md-8">
                <div class="video-section">
                    <div class="video-container" id="videoPlayer">
                        <!-- Default video loads here -->
                    </div>
                    <div class="video-info">
                        <h4 id="videoTitle">Working with Layers (12min)</h4>
                        <p class="text-muted mb-2" id="videoDuration">12 minutes • 2.5K views</p>
                        <div class="d-flex align-items-center">
                            <i class="fas fa-user-circle me-2 text-primary"></i>
                            <span>Nyslearners Official</span>
                        </div>
                    </div>
                </div>
            </div>
            <!-- SIDEBAR -->
             
            <div class="col-lg-3 col-md-4 sidebar-custom  ">
                <div class="fw-bold text-center mb-5 pb-2  custom-style-h5"><h5>📚 Course Content</h5>
               </div>
                <ul class="list-group list-group-flush custom-list" id="videoList">
                    <!-- Videos dynamically loaded -->
                </ul>
            </div>
        </div>
			    	</div>
				</div>
			     
			</div>
			<div class="card border rounded m-2">
				<div class="card-header m-1"><h3 class="card-title text-white"> notes</h3></div>
			    <div class="card-body"></div>
			    </div>
			</div>
		</div>
	</main>
</div>
	<script src="script.js"></script>
</body>

</html>
