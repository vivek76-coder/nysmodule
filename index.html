<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1" shrink-to-fit="no">

	<link rel="stylesheet" type="text/css" href="style.css">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

	<script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js"
		integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
		crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js"
		integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
		crossorigin="anonymous"></script>
</head>

<body>
	<!--navbar-->
	<nav>
		<div class="container-fluid ">
			<div class="div1-nav">
				<!--home bar-->
				<a href="" class="home-nav">
					<i class="fa-solid fa-house"></i>
					&nbsp;Home
				</a>
			</div>
			<div class="div2-nav">
				<h2 id="nav-text">Nysonlearners</h2>
			</div>
			<div class="div3-nav">
				<!-- for notification -->
				<div class="notification">
					<button class="style-icon-notification">
						<i class="fa-regular fa-bell"></i>
					</button>
				</div>
				<!-- for logo -->
				<div class="logo">
					<div class="username">
						<h3>name</h3>
					</div>
					<div class="imgicon">
						<img src="https://nyslearners.com/static/profile_pics/default.png" alt="image.png">
					</div>
				</div>
				<!-- logout-->
				<div class="logout">
					<button class="style-icon-logout">
						<i class="fa-solid fa-power-off"></i>
					</button>
				</div>
			</div>
		</div>
	</nav>
	<main id="main-content" class="mx-auto">
	<!-- dashboard-->
	<div class="container-fluid-sm w-75 mx-auto custome-conatainer-dashboard p-2 border">
		<div class="container-lg custome-conatiner mx-auto d-flex flex-column ">
			<div class="col-lg-6 col-md-6 custome-container2 mx-auto">
				<img src="https://nyslearners.com/static/profile_pics/default.png">
				<br>
				<p><span><b>Hi</b></span>&nbsp;Name</p>
			</div>
			<div class="row">
				<div class="col-md-8 mx-auto">
					<div class="progress">
						<div class="progress-bar progress-bar-striped progress-bar-animated" style="width:80%"></div>
					</div>
				</div>
			</div>
			<h3 class="text-center text-white">your current status<h3>
		</div>
	</div>
	<!-- entire body -->
	<!-- content-->
			<div class="container-fluid-lg border shadow-lg mx-5">
				<div class="card border rounded m-2">
					<div class="card-header h-50">
						<h3 class="card-title text-white">notes</h3>
					</div>
					<!-- VIDEO SECTION -->
					<div class="card-body">
						<div class="container-fluid h-50">
							<iframe class="w-100" src="https://www.youtube.com/embed/WuenCV6kGAc?si=rrlKFR7Rwsclk7VP" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>e>
					<div class="container-fluid border mt-1 shadow-sm w-100">
						<span> <h3><p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Ducimus dolor quae porro earum amet assumenda vero? Doloribus, sequi est! Quidem.</p></h3></span>
					</div>
					</div>
                   </div>
				</div>
				<div class="card border rounded m-2">
					<div class="card-header m-1">
						<h3 class="card-title text-white"> notes</h3>
					</div>
					<div class="card-body">
    
          <!-- Hidden pdf URL (your app should set this to the PDF file URL) -->
          <input type="hidden" id="pdfUrl" value="static/uploads/TS_1(selection).pdf">

          <!-- Controls -->
          <div class="d-flex align-items-center controls-row mb-2 pdf-controls">
            <button id="openPDF" class="btn btn-secondary btn-sm">
              <i class="bi bi-folder2-open"></i>&nbsp;Open PDF
            </button>

           
            <div class="d-flex align-items-center ms-3">
              <button id="previous" class="btn btn-outline-secondary btn-sm" disabled="">
                <i class="bi bi-arrow-left-circle"></i>&nbsp;Prev
              </button>
              <span id="current_page" class="mx-2 fw-semibold">0 / 0</span>
              <button id="next" class="btn btn-outline-secondary btn-sm" disabled="">
                Next&nbsp;<i class="bi bi-arrow-right-circle"></i>
              </button>
            </div>

            <!-- <div class="ms-auto">
              <button id="allNotes" class="btn btn-dark btn-sm" onclick="window.history.back();">
                <i class="bi bi-journal-text"></i>&nbsp;All Notes
              </button>
            </div> -->
          </div>

          <!-- viewer wrapper (scrollable) -->
          <div class="pdf-canvas-wrap">
            <!-- The canvas is hidden until PDF is loaded -->
            <canvas class="pdf-viewer d-none" id="pdfCanvas"></canvas>
          </div>
      
      </div>

      <!-- flash messages (keeps your existing logic) -->
   
    
    <!-- Flash Messages -->
    <div id="flash-messages">
        
        
        
    </div>

    <!-- JavaScript for Auto-Dismissing Messages -->
    <script>
        setTimeout(() => {
            const flashMessages = document.querySelectorAll('.flash-message');
            flashMessages.forEach(msg => msg.remove());
        }, 5000); // 5 seconds
    </script>

    <script src="script.js"></script>
    </div>
					</div>
				</div>
			
	</div>
	</main>
	</div>
	<script src="script.js"></script>
</body>

</html>
