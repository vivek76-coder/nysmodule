<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Gallery - Nyslearners</title>
    <!-- Bootstrap 5-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
   <link rel="stylesheet" href="videos/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm fixed-top">
        <div class="container-fluid">
            <a href="#" class="navbar-brand fw-bold">
                <i class="fa-solid fa-laptop-code me-2"></i>Nyslearners
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#">Courses</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Profile</a></li>
                </ul>
            </div>
        </div>
    </nav>
    
    <!-- Main Content -->
    
    <div class="container-fluid">
        <div class="row g-0">
    <!-- VIDEO SECTION -->
    <div class="col-lg-9 col-md-8">
                <div class="video-section">
                    <div class="video-container" id="videoPlayer">
                        <!-- Default video loads here -->
                    </div>
                    <div class="video-info">
                        <h4 id="videoTitle">Working with Layers (12min)</h4>
                        <p class="text-muted mb-2" id="videoDuration">12 minutes • 2.5K views</p>
                        <div class="d-flex align-items-center">
                            <i class="fas fa-user-circle me-2 text-primary"></i>
                            <span>Nyslearners Official</span>
                        </div>
                    </div>
                </div>
            </div>
            <!-- SIDEBAR -->
             
            <div class="col-lg-3 col-md-4 sidebar-custom p-3 ">
                <div class="fw-bold text-center mb-5 pb-2  custom-style-h5"><h5>📚 Course Content</h5>
               </div>
                <ul class="list-group list-group-flush custom-list" id="videoList">
                    <!-- Videos dynamically loaded -->
                </ul>
            </div>
        </div>
    </div>
    
    <script src="videos/script.js"></script>
    <script>
      
    </script>
</body>
</html>
