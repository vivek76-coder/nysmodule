<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Gallery - Nyslearners</title>
    <!-- Bootstrap 5 (Better than 4.3.1) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
   <link rel="stylesheet" href="videos/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm fixed-top">
        <div class="container-fluid">
            <a href="#" class="navbar-brand fw-bold">
                <i class="fa-solid fa-laptop-code me-2"></i>Nyslearners
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#">Courses</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Profile</a></li>
                </ul>
            </div>
        </div>
    </nav>
    
    <!-- Main Content -->
    
    <div class="container-fluid">
        <div class="row g-0">
    <!-- VIDEO SECTION -->
    <div class="col-lg-9 col-md-8">
                <div class="video-section">
                    <div class="video-container" id="videoPlayer">
                        <!-- Default video loads here -->
                    </div>
                    <div class="video-info">
                        <h4 id="videoTitle">Working with Layers (12min)</h4>
                        <p class="text-muted mb-2" id="videoDuration">12 minutes • 2.5K views</p>
                        <div class="d-flex align-items-center">
                            <i class="fas fa-user-circle me-2 text-primary"></i>
                            <span>Nyslearners Official</span>
                        </div>
                    </div>
                </div>
            </div>
            <!-- SIDEBAR -->
            <div class="col-lg-3 col-md-4 sidebar-custom p-3">
                <h5 class="fw-bold text-center mb-4 pb-2 border-bottom">📚 Course Content</h5>
                <ul class="list-group list-group-flush" id="videoList">
                    <!-- Videos dynamically loaded -->
                </ul>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // 🔥 VIDEO DATA - RGPV + Demo videos
        const videos = [
            { id: 'bh9qvZKEQZY', title: 'Working with Layers (12min)', duration: '12min • 5K views' },
            { id: 'eReZnLFLVi0', title: 'Animating with Lights (18min)', duration: '18min • 8K views' },
            { id: '42BO6tD9tRU', title: 'Camera Techniques (22min)', duration: '22min • 12K views' },
            { id: 'V3ChCroWttY', title: '3D Scene Building (25min)', duration: '25min • 15K views' },
            { id: 'ZwC2Mh2OBJc', title: 'Advanced Effects (30min)', duration: '30min • 20K views' },
            { id: 'xaWdYbh4tH4', title: 'Motion Graphics (20min)', duration: '20min • 10K views' }
        ];

        // Load sidebar videos
        function loadVideos() {
            const videoList = document.getElementById('videoList');
            videos.forEach((video, index) => {
                const listItem = document.createElement('a');
                listItem.className = 'list-group-item list-group-item-action';
                listItem.innerHTML = `
                    <div class="d-flex align-items-center">
                        <i class="fas fa-play-circle me-3 text-primary fs-4"></i>
                        <div>
                            <div>${video.title}</div>
                            <small class="text-muted">${video.duration}</small>
                        </div>
                    </div>
                `;
                listItem.addEventListener('click', () => playVideo(video.id, video.title, video.duration));
                videoList.appendChild(listItem);
            });
        }

        // 🔥 MAIN FUNCTION - Play video on sidebar click
        function playVideo(videoId, title, duration) {
            // Update active state
            document.querySelectorAll('#videoList .list-group-item').forEach(item => {
                item.classList.remove('active');
            });
            event.currentTarget.classList.add('active');

            // Update video player
            const player = document.getElementById('videoPlayer');
            player.innerHTML = `
                <iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0" 
                        title="${title}" 
                        frameborder="0" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                        allowfullscreen>
                </iframe>
            `;

            // Update video info
            document.getElementById('videoTitle').textContent = title;
            document.getElementById('videoDuration').textContent = duration;
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadVideos();
            // Set first video as active
            document.querySelector('#videoList .list-group-item').click();
        });
    </script>
</body>
</html>
